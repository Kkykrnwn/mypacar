<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Terkunci!!</title>
    
    <meta property="og:title" content="Halaman Terkunci!! 🔐">
    <meta property="og:description" content="Haii Ayangg! Masukkan kata sandi dulu ya untuk masuk ke halaman ini.. ❤️">
    <meta property="og:image" content="https://kkykrnwn.github.io/icon.ico">
    <meta property="og:type" content="website">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="300">
    <meta property="og:image:height" content="300">

    <link rel="shortcut icon" type="image/x-icon" href="./img/icon.ico">

    <style>
        /* CSS tetap sama seperti kode kamu sebelumnya */
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #222 url('./img/papayang.png') no-repeat center center/cover;
            overflow: hidden;
        }
        /* ... sisa CSS kamu ... */
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
        }
        h2 { color: #fff; font-weight: 600; margin-bottom: 20px; }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        input { width: 100%; padding: 12px; padding-right: 45px; border: none; border-radius: 8px; font-size: 16px; background: rgba(255, 255, 255, 0.2); color: #fff; outline: none; }
        .eye-icon { position: absolute; right: 12px; cursor: pointer; width: 22px; height: 22px; fill: white; opacity: 0.8; }
        .hidden { display: none; }
        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px; background: linear-gradient(to right, #ff416c, #ff4b2b); color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .error { color: #ff4b2b; font-size: 14px; margin-top: 10px; opacity: 0; transition: opacity 0.5s; }
        .error.show { opacity: 1; }
        .popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #28a745; color: white; padding: 20px; border-radius: 8px; z-index: 100; }
        .countdown { color: #fff; font-size: 16px; font-weight: bold; margin-top: 10px; display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Login</h2>
    <div class="password-wrapper">
        <input type="password" id="password" 
               placeholder="Masukkan kata sandi..." 
               onkeypress="handleKeyPress(event)"
               autocomplete="off" 
               spellcheck="false" 
               autocorrect="off" 
               autocapitalize="none">
        
        <svg id="eyeOpen" class="eye-icon" onclick="togglePassword()" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.7 8 1 12c1.7 4 6 7.5 11 7.5s9.3-3.5 11-7.5c-1.7-4-6-7.5-11-7.5zm0 12.5c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm0-8c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3z"/>
        </svg>

        <svg id="eyeClosed" class="eye-icon hidden" onclick="togglePassword()" viewBox="0 0 24 24">
            <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
        </svg>
    </div>
    <button onclick="validatePassword()">Masuk</button>
    <p id="error-message" class="error"></p>
    <p id="countdown" class="countdown"></p>
</div>

<audio id="countdown-sound" loop>
    <source src="https://kkykrnwn.github.io/script-bucin/mp3/alarm.mp3" type="audio/wav">
</audio>

<div id="success-popup" class="popup hidden">
    <p>Selamat datang sayangg🤍</p>
</div>

<script>
    // Script tetap sama seperti kode kamu sebelumnya
    (function () {
        window.onpageshow = function(event) {
            if (event.persisted) { window.location.reload(); }
        };
    })();

    window.onload = function() {
        document.getElementById("password").value = "";
    };

    let attempts = 0;
    const maxAttempts = 4;
    const correctPassword = "auliapunyakiky";

    function handleKeyPress(e) {
        if (e.key === "Enter") validatePassword();
    }

    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const eyeOpen = document.getElementById("eyeOpen");
        const eyeClosed = document.getElementById("eyeClosed");
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeOpen.classList.add("hidden");
            eyeClosed.classList.remove("hidden");
        } else {
            passwordInput.type = "password";
            eyeOpen.classList.remove("hidden");
            eyeClosed.classList.add("hidden");
        }
    }

    function validatePassword() {
        const passwordInput = document.getElementById("password");
        const errorMessage = document.getElementById("error-message");
        const countdownMessage = document.getElementById("countdown");
        const audio = document.getElementById("countdown-sound");
        const button = document.querySelector("button");

        if (passwordInput.value.trim() === correctPassword) {
            errorMessage.textContent = "✅ Kata sandi benar!";
            errorMessage.classList.add("show");
            document.getElementById("success-popup").classList.remove("hidden");
            setTimeout(() => { window.location.href = "./file/utama.html"; }, 2000);
        } else {
            attempts++;
            errorMessage.textContent = `❌ Salah! Sisa: ${maxAttempts - attempts}`;
            errorMessage.classList.add("show");
            passwordInput.value = "";
            if (attempts >= maxAttempts) {
                passwordInput.disabled = true;
                button.disabled = true;
                countdownMessage.style.display = "block";
                audio.play();
                let count = 10;
                let timer = setInterval(() => {
                    countdownMessage.textContent = `Mengalihkan dalam ${count}...`;
                    if (count <= 0) {
                        clearInterval(timer);
                        audio.pause();
                        window.location.href = "https://www.instagram.com/kky_krnwn331";
                    }
                    count--;
                }, 1000);
            }
        }
    }
</script>
</body>
</html>
