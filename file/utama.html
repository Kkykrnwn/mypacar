<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Halaman Auliaaa</title>
    <link rel="shortcut icon" type="image/x-icon" href="../img/icon.ico">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #89cff0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0; color: white; text-align: center;
            min-height: 200vh; /* Agar bisa scroll */
            background-size: cover; background-position: center;
            background-attachment: fixed; transition: background-image 1.2s ease;
            user-select: none; -webkit-user-select: none; overflow-x: hidden;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); z-index: -1;
        }

        /* Efek Silau Matahari (Sun Blind) */
        #sun-blind {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 9999;
            clip-path: circle(0% at 50% 50%);
            transition: opacity 0.2s ease, clip-path 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sun-blind.active {
            opacity: 1;
            clip-path: circle(150% at var(--x) var(--y));
        }

        /* Animasi Judul Turun */
        header { 
            padding: 80px 20px 40px; 
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.8s;
            transform: translateY(-50px);
            opacity: 0;
        }
        header.visible { transform: translateY(0); opacity: 1; }

        header h1 { font-weight: 300; letter-spacing: 4px; text-shadow: 0 4px 15px rgba(0,0,0,0.6); margin: 0; }

        .main-container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        /* Grid & Item Naik */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 150px;
        }

        .file-item {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 25px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1);
            opacity: 0; 
            transform: translateY(60px); /* Standby di bawah */
            position: relative;
        }

        /* Saat di-scroll atau awal muncul */
        .file-item.visible { opacity: 1; transform: translateY(0); }

        .file-item:active { transform: scale(0.9) !important; background: white; }

        .file-number {
            font-size: 10px; background: var(--accent); color: #000;
            padding: 2px 8px; border-radius: 10px; font-weight: bold; margin-bottom: 10px;
        }
        .file-name { font-size: 14px; pointer-events: none; text-transform: capitalize; }

        /* Footer & Info */
        footer { padding: 60px 20px; background: rgba(0, 0, 0, 0.8); font-size: 12px; }
        footer a { color: var(--accent); text-decoration: none; font-weight: bold; }

        #clock, #date {
            position: fixed; bottom: 15px; font-size: 11px; color: var(--accent);
            background: rgba(0,0,0,0.6); padding: 6px 15px; border-radius: 20px;
            backdrop-filter: blur(8px); z-index: 1000; border: 1px solid var(--glass-border);
        }
        #clock { left: 15px; }
        #date { right: 15px; }

    </style>
</head>
<body oncontextmenu="return false;">

    <div id="sun-blind"></div>

    <header id="header">
        <h1>Aulia's Library</h1>
    </header>

    <div class="main-container">
        <div class="file-grid" id="fileGrid"></div>
    </div>

    <footer>
        <p>Copyright © 2025 All Rights Reserved.<br>
        Designed by <a href="https://instagram.com/kky_krnwn331" target="_blank">Kikyy</a> untuk 
        <a href="https://instagram.com/liaagsttn" target="_blank">Auliaa</a></p>
    </footer>

    <div id="clock">00:00</div>
    <div id="date">...</div>

    <script>
        const files = [
            { id: 1, name: "aku pelupa", url: "cobabagi.html" }, { id: 2, name: "aku takut😖", url: "akutakut.html" },
            { id: 3, name: "apakah pernah?", url: "apakahpernah.html" }, { id: 4, name: "asal kamu tau", url: "asalkamutau.html" },
            { id: 5, name: "ayang apa?", url: "kamuapa.html" }, { id: 6, name: "boleh gak?", url: "buatkamuaja.html" },
            { id: 7, name: "boro boro", url: "boroboro.html" }, { id: 8, name: "buat sayangkuu", url: "buatsayangku.html" },
            { id: 9, name: "cemunguttt", url: "cemungut.html" }, { id: 10, name: "challenge", url: "challenge.html" },
            { id: 11, name: "coba tebakk", url: "cobatebak.html" }, { id: 12, name: "hadiah terbesarku", url: "hadiahterbesar.html" },
            { id: 13, name: "haii ayangg", url: "haibuatkamu.html" }, { id: 14, name: "jika nanti", url: "jikananti.html" },
            { id: 15, name: "kalo ada", url: "kaloada.html" }, { id: 16, name: "maaf 🥺", url: "maaf.html" },
            { id: 17, name: "maaf jika", url: "maafjika.html" }, { id: 18, name: "maaf yaaa", url: "dibacadong.html" },
            { id: 19, name: "makasii", url: "terimakasih.html" }, { id: 20, name: "makasii yaa", url: "dibacayuk.html" },
            { id: 21, name: "mau nanya nihh", url: "untukmu.html" }, { id: 22, name: "melupakanmu?", url: "akupanik.html" },
            { id: 23, name: "memory game", url: "memorygame.html" }, { id: 24, name: "minta thr 😋", url: "akuminta.html" },
            { id: 25, name: "penghargaan", url: "hanyabuatmu.html" }, { id: 26, name: "pesan buat ayang", url: "pesanbuatayang.html" },
            { id: 27, name: "pesan buat ayangg", url: "dariku.html" }, { id: 28, name: "pilih warna apa?", url: "heikm.html" },
            { id: 29, name: "pilih mana hayoo", url: "sayangi.html" }, { id: 30, name: "pokoknya", url: "pokoknya.html" },
            { id: 31, name: "sayang bangett", url: "sygbanget.html" }, { id: 32, name: "sayang sama aku?", url: "bukabentarya.html" },
            { id: 33, name: "semangatt", url: "semangat.html" }, { id: 34, name: "sesuatu buat ayang", url: "heibuka.html" },
            { id: 35, name: "Simsalabim!! 🥳", url: "hitungan.html" }, { id: 36, name: "tangkap", url: "tangkap.html" }
        ];

        const grid = document.getElementById('fileGrid');
        const sunBlind = document.getElementById('sun-blind');
        const header = document.getElementById('header');

        // Render Cards
        files.forEach((file) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `<span class="file-number">${file.id}</span><span class="file-name">${file.name}</span>`;
            
            // Logika Klik + Efek Matahari
            item.addEventListener('click', (e) => {
                const x = e.clientX;
                const y = e.clientY;
                sunBlind.style.setProperty('--x', x + 'px');
                sunBlind.style.setProperty('--y', y + 'px');
                sunBlind.classList.add('active');

                setTimeout(() => {
                    window.open(file.url, '_blank');
                    setTimeout(() => { sunBlind.classList.remove('active'); }, 600);
                }, 500);
            });

            grid.appendChild(item);
        });

        // Intersection Observer untuk Animasi Scroll
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                } else {
                    // Animasi balik saat scroll ke atas
                    entry.target.classList.remove('visible');
                }
            });
        }, observerOptions);

        // Amati Header dan Semua Item File
        observer.observe(header);
        document.querySelectorAll('.file-item').forEach(el => observer.observe(el));

        // Background
        const wallpapers = Array.from({length: 11}, (_, i) => `../img/papayang${i+1}.png`);
        let wpIndex = 0;
        function changeBG() {
            document.body.style.backgroundImage = `url('${wallpapers[wpIndex]}')`;
            wpIndex = (wpIndex + 1) % wallpapers.length;
        }
        setInterval(changeBG, 7000); changeBG();

        // Clock
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('date').innerText = now.toLocaleDateString('id-ID', {weekday:'short', day:'numeric', month:'short'});
        }
        setInterval(updateTime, 1000); updateTime();
        
        // Mencegah klik saat scroll berat
        let isScrolling;
        window.addEventListener('scroll', () => {
            document.body.classList.add('is-scrolling');
            clearTimeout(isScrolling);
            isScrolling = setTimeout(() => { document.body.classList.remove('is-scrolling'); }, 150);
        });
    </script>
</body>
</html>
