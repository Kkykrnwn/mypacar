<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Mengunci skala zoom halaman -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Untuk Ayang ❤️</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kkykrnwn.github.io/mypacar/file/birthday.html" />
    <meta property="og:title" content="Anda kepo dengan isinya?" />
    <meta property="og:description" content="Makanya klik dan lihat sendiri isinya!!" />
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kkykrnwn.github.io/mypacar/file/birthday.html" />
    <meta property="twitter:title" content="Anda kepo dengan isinya?" />
    <meta property="twitter:description" content="Makanya klik dan lihat sendiri isinya!!" />
  <style>
    /* Styling Pop-up Overlay & Kartu Notifikasi */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .popup-card {
      background-color: #1a1a1a;
      color: #ffffff;
      padding: 20px 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 320px;
      width: 85%;
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1px solid #333333;
    }

    /* Class pembantu untuk animasi memudar */
    .popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* Mencegah seleksi/pilih teks pada seluruh elemen */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #ffe6e9, #f0fff4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
      max-height: 90vh; /* Menjaga kartu tidak melebihi tinggi layar */
      display: flex;
      flex-direction: column;
    }
    h1 { color: #ff4b5c; margin-bottom: 15px; font-size: 1.8rem; }
    .typewriter-container {
      max-height: 250px; /* Batas tinggi kontainer teks */
      overflow-y: auto; /* Memungkinkan scroll saat teks melebihi batas */
      scroll-behavior: smooth; /* Efek gulir halus */
      margin: 15px 0;
      text-align: left;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #444;
      white-space: pre-line;
      padding-right: 5px;
    }
    /* Mengubah tampilan scrollbar agar lebih estetis */
    .typewriter-container::-webkit-scrollbar {
      width: 4px;
    }
    .typewriter-container::-webkit-scrollbar-thumb {
      background-color: rgba(255, 75, 92, 0.4);
      border-radius: 10px;
    }
    .cursor { display: inline-block; width: 2px; background-color: #ff4b5c; animation: blink 0.7s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .btn {
      background-color: #ff4b5c;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-top: 10px;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background-color: #e03e4e; transform: scale(1.05); }
    #fullContent { display: none; } /* Sembunyikan konten awal */
  </style>
</head>
<body>

  <div class="card">
    <!-- Konten Awal -->
    <div id="initialContent">
      <h2 style="color: #ff4b5c; margin-bottom: 20px;">Alooo Ayangg! ❤️</h2>
      <p>Aku ada pesan nih buat ayang.</p>
      <button class="btn" onclick="startSurprise()">Buka Pesan</button>
    </div>

    <!-- Konten Setelah Diklik -->
    <div id="fullContent">
      <h1>🎉 Selamat Ulang Tahun! 🎉</h1>
      <div class="typewriter-container" id="typeContainer">
        <span id="text"></span><span class="cursor">&nbsp;</span>
      </div>
      <a href="https://wa.me/6285603209755?text=Makasih%20sayang%20buat%20pesan%20dan%20ucapannya!%20I%20love%20you%20too%20%E2%9D%A4%EF%B8%8F" 
         class="btn" id="waBtn" style="display: none;">Balas ke WhatsApp</a>
    </div>
  </div>

  <!-- Pop-up Notifikasi Elegan -->
  <div id="volumePopup" class="popup-overlay">
    <div class="popup-card">
      <p>🔊 Biar lebih berasa, atur volume HP ayang sekitar <strong>35%</strong> ya!</p>
    </div>
  </div>

  <audio id="bgm" loop>
    <source src="../mp3/birthday.mp3" type="audio/mpeg">
  </audio>

  <script>
    const pesan = `Selamat ulang tahun yang ke-19 ya, sayang! ❤️

Terima kasih banyak udah hadir di hidupku dan selalu bikin hari-hariku jadi jauuuh lebih berwarna. Semenjak ada ayang, hal sederhana pun rasanya jadi luar biasa indah.

Di usia ayang yang baru ini, aku cuma mau berdoa semoga ayang selalu diberi kebahagiaan yang melimpah, makin sukses, makin cantik, lucu, gemoy, gemesin, sehat selalu, dan semua impian yang ayang cita-citakan bisa terwujud satu persatu. Ingat ya, apa pun yang terjadi, aku bakal selalu ada di sini buat dukung dan nemenin ayang.

I’m so endlessly grateful and lucky to have you in my life. Selamat hari jadi, pacarku tersayang! Warmest hugs and big kisses for you today! 🎉✨💖
I Love You Sayangg😚`;

    let index = 0;
    const speed = 60;

    function startSurprise() {
      // 1. Sembunyikan tampilan awal & tampilkan konten utama
      document.getElementById("initialContent").style.display = "none";
      document.getElementById("fullContent").style.display = "block";

      const popup = document.getElementById("volumePopup");
      const bgm = document.getElementById("bgm");

      // 2. Munculkan pop-up perlahan (fade in)
      popup.classList.add("show");

      // 3. Tampilkan pop-up selama 2.5 detik
      setTimeout(() => {
        // Hilangkan pop-up perlahan (fade out)
        popup.classList.remove("show");

        // 4. Setelah pop-up menghilang, jalankan musik lebih dulu
        setTimeout(() => {
          bgm.play();
          
          // Memperkuat volume sinyal audio sebesar 3x lipat
          boostAudio(bgm, 3);

          // 5. Beri jeda 7 detik setelah lagu diputar, baru jalankan efek ketik
          setTimeout(() => {
            typeWriter();
          }, 7000);

        }, 600);

      }, 2500);
    }

    function typeWriter() {
      if (index < pesan.length) {
        document.getElementById("text").innerHTML += pesan.charAt(index);
        index++;
        
        // Auto-scroll ke bawah saat teks bertambah
        const container = document.getElementById("typeContainer");
        container.scrollTop = container.scrollHeight;
        
        setTimeout(typeWriter, speed);
      } else {
        // Tampilkan tombol WA setelah selesai mengetik
        const waBtn = document.getElementById("waBtn");
        waBtn.style.display = "inline-block";
        
        // Pastikan tombol WA langsung terlihat tanpa perlu scroll manual
        waBtn.scrollIntoView({ behavior: 'smooth' });
      }
    }

    // Mencegah klik kanan (anti inspeksi & download via menu konteks)
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // Mencegah tombol pintas keyboard (Ctrl+C, Ctrl+U, Ctrl+S, F12)
    document.addEventListener('keydown', (e) => {
      if (
        e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'a') ||
        e.key === 'F12'
      ) {
        e.preventDefault();
      }
    });

    // Mencegah gesture zoom pada perangkat layar sentuh
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('gesturestart', (e) => e.preventDefault());

    // Fungsi untuk meningkatkan amplitudo audio menggunakan Web Audio API
    function boostAudio(audioElement, multiplier) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const source = audioCtx.createMediaElementSource(audioElement);
        const gainNode = audioCtx.createGain();

        // Mengatur penguatan suara (multiplier 3 = 3x lipat gain digital)
        gainNode.gain.value = multiplier;

        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (err) {
        console.log("Web Audio API tidak didukung atau sudah terinisialisasi:", err);
      }
    }
  </script>
</body>
</html>
